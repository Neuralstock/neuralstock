name: Production health

on:
  schedule:
    - cron: "43 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  public-contract:
    name: Public registry and download health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out production verification sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify the complete public contract
        run: sh tools/verify-production.sh
