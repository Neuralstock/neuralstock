name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix
        required: true
        default: 0.1.0
        type: string
      build_time:
        description: Reproducible UTC build timestamp
        required: true
        default: "2026-08-01T00:00:00Z"
        type: string
      publish_time:
        description: Reproducible UTC registry timestamp
        required: true
        default: "2026-08-01T21:00:00Z"
        type: string
      publish_github_release:
        description: Publish the verified candidate to an existing matching tag
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and attest release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify protected release tag on main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "v$RELEASE_VERSION"
          tools/verify-release-tag.sh "$RELEASE_VERSION" "$GITHUB_SHA"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: pnpm
          package-manager-cache: false

      - name: Validate release request
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - "$RELEASE_VERSION" <<'PY'
          import ast
          import json
          import re
          import sys
          from pathlib import Path

          requested = sys.argv[1]
          if re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", requested) is None:
              raise SystemExit("version must be a plain semantic version")
          init_path = Path("src/neuralstock/__init__.py")
          init_module = ast.parse(init_path.read_text(), filename=str(init_path))
          package_version = None
          for node in init_module.body:
              if not isinstance(node, ast.Assign):
                  continue
              if any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets):
                  package_version = ast.literal_eval(node.value)
                  break
          if not isinstance(package_version, str):
              raise SystemExit(f"{init_path} has no literal __version__ assignment")
          if package_version != requested:
              raise SystemExit(f"requested version does not match {init_path}")
          for package_path in (Path("package.json"), Path("packages/client/package.json")):
              package = json.loads(package_path.read_text())
              if package["version"] != requested:
                  raise SystemExit(f"requested version does not match {package_path}")
          PY
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "v$RELEASE_VERSION"
          if grep --recursive --line-number --fixed-strings \
            'https://neuralstock.org/schemas/' \
            schemas profiles catalog blender src tests packages; then
            echo 'Release input still references the unowned schema domain.' >&2
            exit 1
          fi

      - name: Build verified Room Zero release
        env:
          NEURALSTOCK_BUILD_TIME: ${{ inputs.build_time }}
          NEURALSTOCK_PUBLISH_TIME: ${{ inputs.publish_time }}
        run: tools/release-room-zero.sh assets/room-zero work/release-candidate dist/release

      - name: Package deterministic candidate
        env:
          NEURALSTOCK_RELEASE_TAG: v${{ inputs.version }}
          NEURALSTOCK_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          tools/package-release-candidate.sh \
            "${{ inputs.version }}" \
            dist/release \
            work/release-candidate/r2-plan.json \
            work/release-candidate/neuralstock-blender.metadata.json \
            dist/release-candidate
          tools/verify-release-candidate.sh \
            dist/release-candidate \
            "${{ inputs.version }}" \
            "$(jq -r .revision dist/release/registry.json)"

      - name: Attest release candidate
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/release-candidate/neuralstock-release-${{ inputs.version }}.tar.gz
            dist/release-candidate/SHA256SUMS
            dist/release-candidate/release-metadata.json
            dist/release-candidate/r2-plan.json
            dist/release-candidate/worker-image-metadata.json

      - name: Upload release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate
          path: dist/release-candidate
          if-no-files-found: error
          retention-days: 30

  publish-github-release:
    name: Publish GitHub release
    if: inputs.publish_github_release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out selected tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Reverify protected release tag on main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "v$RELEASE_VERSION"
          tools/verify-release-tag.sh "$RELEASE_VERSION" "$GITHUB_SHA"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Download verified candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate
          path: dist/release-candidate

      - name: Verify candidate again
        run: |
          tools/verify-release-candidate.sh \
            dist/release-candidate \
            "${{ inputs.version }}"
          test "$(jq -r .source_commit dist/release-candidate/release-metadata.json)" = \
            "$GITHUB_SHA"
          test "$(jq -r .release_tag dist/release-candidate/release-metadata.json)" = \
            "$GITHUB_REF_NAME"

      - name: Publish assets to matching tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "v${{ inputs.version }}"
          gh release create "$GITHUB_REF_NAME" \
            dist/release-candidate/* \
            --generate-notes \
            --title "NeuralStock ${{ inputs.version }}" \
            --verify-tag
